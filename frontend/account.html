<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetchr — Mon compte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #14141f;
            --surface-hover: #1c1c2a;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #6b6b80;
            --accent: #6366f1;
            --glow: #6366f1;
            --gold: #f59e0b;
            --green: #22c55e;
            --red: #ef4444;
            --radius: 12px;
        }

        [data-theme="light"] {
            --bg: #f4f4f8;
            --surface: #ffffff;
            --surface-hover: #eeeef2;
            --border: #d8d8e0;
            --text: #1a1a2e;
            --text-muted: #6b6b80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Top bar — same as index.html */
        .topbar {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            position: relative;
            z-index: 10;
        }

        .topbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-decoration: none;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .api-link {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: color 0.2s ease, border-color 0.2s ease;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.05em;
        }

        .api-link:hover {
            color: var(--text);
            border-color: var(--glow);
        }

        .pro-link {
            font-size: 0.8rem;
            font-weight: 600;
            color: #f59e0b;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #f59e0b;
            border-radius: 6px;
            font-family: 'Space Grotesk', sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .pro-link:hover {
            background: #f59e0b;
            color: #fff;
        }

        /* Theme toggle */
        .theme-toggle {
            position: relative;
            width: 44px;
            height: 24px;
            cursor: pointer;
        }

        .theme-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-thumb svg {
            width: 11px;
            height: 11px;
            fill: var(--bg);
        }

        .theme-toggle input:checked ~ .toggle-thumb {
            transform: translateX(20px);
            background: var(--glow);
        }

        /* Account button */
        .account-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
            text-decoration: none;
        }

        .account-btn:hover {
            border-color: var(--glow);
        }

        .account-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .account-btn.logged-in {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .account-btn.logged-in svg {
            display: none;
        }

        /* Page content */
        .page {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 0 80px;
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 32px;
        }

        /* Auth forms */
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .auth-tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: scale(1.02);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-error {
            font-size: 0.8rem;
            color: var(--red);
            margin-top: 12px;
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        /* Account info (shown when logged in) */
        .account-info {
            display: none;
        }

        .account-info.visible {
            display: block;
        }

        .account-card {
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .account-card .username {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .account-card .email {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .account-card .plan {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .account-card .plan .badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 3px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #fff;
            margin-left: 4px;
            vertical-align: middle;
        }

        .api-token {
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .api-token label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
        }

        .token-row {
            display: flex;
            gap: 8px;
        }

        .token-row input {
            flex: 1;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            outline: none;
        }

        .token-row button {
            padding: 10px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .token-row button:hover {
            border-color: var(--accent);
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--red);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.05);
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a href="/" class="topbar-brand">Fetchr</a>
        <div class="topbar-actions">
            <a href="/api.html" class="api-link">API</a>
            <a href="/pro.html" class="pro-link">Pro</a>
            <label class="theme-toggle" title="Changer de theme">
                <input type="checkbox" id="themeSwitch">
                <span class="toggle-track"></span>
                <span class="toggle-thumb">
                    <svg viewBox="0 0 16 16" id="themeIcon">
                        <path d="M8 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 8 1zm0 11a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 8 12zm7-4a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1 0-1h1a.5.5 0 0 1 .5.5zM4 8a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1 0-1h1A.5.5 0 0 1 4 8zm8.5-3.8a.5.5 0 0 1 0 .7l-.7.7a.5.5 0 1 1-.7-.7l.7-.7a.5.5 0 0 1 .7 0zM5 11.3a.5.5 0 0 1 0 .7l-.7.7a.5.5 0 0 1-.7-.7l.7-.7a.5.5 0 0 1 .7 0zm7.7.7a.5.5 0 0 1-.7 0l-.7-.7a.5.5 0 0 1 .7-.7l.7.7a.5.5 0 0 1 0 .7zM5 4.6a.5.5 0 0 1-.7.7l-.7-.7a.5.5 0 0 1 .7-.7l.7.7zM8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                    </svg>
                </span>
            </label>
            <a href="/account.html" class="account-btn" id="accountBtn" title="Mon compte">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
            </a>
        </div>
    </nav>

    <div class="page">
        <!-- Auth (not logged in) -->
        <div id="authSection">
            <h2>Connexion</h2>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Connexion</div>
                <div class="auth-tab" data-tab="signup">Inscription</div>
            </div>

            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="toi@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="********" required>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Se connecter</button>
                <div class="form-error" id="loginError"></div>
            </form>

            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="toi@email.com" required>
                </div>
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="signupUsername" placeholder="ton_pseudo" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="signupPassword" placeholder="8 caracteres minimum" required>
                </div>
                <div class="form-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" id="signupConfirm" placeholder="********" required>
                </div>
                <button type="submit" class="submit-btn" id="signupBtn">Creer mon compte</button>
                <div class="form-error" id="signupError"></div>
            </form>
        </div>

        <!-- Account (logged in) -->
        <div class="account-info" id="accountSection">
            <h2>Mon compte</h2>

            <div class="account-card">
                <div class="username" id="accountUsername"></div>
                <div class="email" id="accountEmail"></div>
                <div class="plan" id="accountPlan"></div>
            </div>

            <div class="api-token">
                <label>Token API</label>
                <div class="token-row">
                    <input type="password" id="apiTokenInput" value="" readonly>
                    <button id="toggleTokenBtn">Afficher</button>
                    <button id="copyTokenBtn">Copier</button>
                </div>
            </div>

            <button class="logout-btn" id="logoutBtn">Se deconnecter</button>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api';

        // Theme toggle
        const themeSwitch = document.getElementById('themeSwitch');
        const saved = localStorage.getItem('theme');
        if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeSwitch.checked = true;
        }
        themeSwitch.addEventListener('change', () => {
            if (themeSwitch.checked) {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Elements
        const authSection = document.getElementById('authSection');
        const accountSection = document.getElementById('accountSection');
        const accountBtn = document.getElementById('accountBtn');

        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
            });
        });

        // Show error
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('visible');
        }

        function hideError(elementId) {
            const el = document.getElementById(elementId);
            el.textContent = '';
            el.classList.remove('visible');
        }

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError('loginError');

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showError('loginError', 'Remplis tous les champs.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Connexion...';

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.detail || data.message || 'Email ou mot de passe incorrect.');
                }

                const data = await res.json();
                localStorage.setItem('fetchr_token', data.token);
                window.location.href = '/';
            } catch (err) {
                showError('loginError', err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        });

        // Register form
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError('signupError');

            const email = document.getElementById('signupEmail').value.trim();
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const btn = document.getElementById('signupBtn');

            if (!email || !username || !password || !confirm) {
                showError('signupError', 'Remplis tous les champs.');
                return;
            }

            if (password !== confirm) {
                showError('signupError', 'Les mots de passe ne correspondent pas.');
                return;
            }

            if (password.length < 8) {
                showError('signupError', 'Le mot de passe doit contenir au moins 8 caracteres.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creation...';

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password }),
                });

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.detail || data.message || 'Erreur lors de la creation du compte.');
                }

                const data = await res.json();
                localStorage.setItem('fetchr_token', data.token);
                window.location.href = '/';
            } catch (err) {
                showError('signupError', err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Creer mon compte';
            }
        });

        // Show account info
        function showAccountInfo(user) {
            authSection.style.display = 'none';
            accountSection.classList.add('visible');

            document.getElementById('accountUsername').textContent = user.username;
            document.getElementById('accountEmail').textContent = user.email;

            const planEl = document.getElementById('accountPlan');
            if (user.is_pro) {
                planEl.innerHTML = 'Plan <span class="badge">PRO</span>';
            } else {
                planEl.innerHTML = 'Plan Free — <a href="/pro.html" style="color: var(--gold);">Passer Pro</a>';
            }

            document.getElementById('apiTokenInput').value = user.api_token || '';

            // Update topbar account button
            accountBtn.classList.add('logged-in');
            accountBtn.textContent = user.username.charAt(0).toUpperCase();
        }

        // Toggle token visibility
        document.getElementById('toggleTokenBtn').addEventListener('click', () => {
            const input = document.getElementById('apiTokenInput');
            const btn = document.getElementById('toggleTokenBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Masquer';
            } else {
                input.type = 'password';
                btn.textContent = 'Afficher';
            }
        });

        // Copy token
        document.getElementById('copyTokenBtn').addEventListener('click', () => {
            const input = document.getElementById('apiTokenInput');
            navigator.clipboard.writeText(input.value);
            const btn = document.getElementById('copyTokenBtn');
            btn.textContent = 'Copie !';
            setTimeout(() => { btn.textContent = 'Copier'; }, 1500);
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('fetchr_token');
            window.location.reload();
        });

        // Check if already logged in
        async function checkAuth() {
            const token = localStorage.getItem('fetchr_token');
            if (!token) return;

            try {
                const res = await fetch(`${API}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                });

                if (!res.ok) {
                    localStorage.removeItem('fetchr_token');
                    return;
                }

                const user = await res.json();
                showAccountInfo(user);
            } catch {
                localStorage.removeItem('fetchr_token');
            }
        }

        checkAuth();
    </script>
</body>
</html>
