<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab — Mon compte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #14141f;
            --surface-hover: #1c1c2a;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #6b6b80;
            --accent: #6366f1;
            --gold: #f59e0b;
            --green: #22c55e;
            --red: #ef4444;
            --radius: 12px;
        }

        [data-theme="light"] {
            --bg: #f4f4f8;
            --surface: #ffffff;
            --surface-hover: #eeeef2;
            --border: #d8d8e0;
            --text: #1a1a2e;
            --text-muted: #6b6b80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 20px;
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 0 80px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            max-width: 480px;
            margin: 0 auto;
        }

        .topbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-decoration: none;
        }

        .topbar-back {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .topbar-back:hover { color: var(--text); }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 32px;
        }

        /* Auth forms */
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .auth-tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .submit-btn:hover {
            transform: scale(1.02);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .oauth-btn {
            width: 100%;
            padding: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: border-color 0.2s ease, background 0.2s ease;
            margin-bottom: 10px;
            text-decoration: none;
        }

        .oauth-btn:hover {
            border-color: var(--text-muted);
            background: var(--surface-hover);
        }

        .oauth-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Account info (shown when logged in) */
        .account-info {
            display: none;
        }

        .account-card {
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .account-card .email {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .account-card .plan {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .account-card .plan .badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 3px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #fff;
            margin-left: 4px;
            vertical-align: middle;
        }

        .api-token {
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .api-token label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
        }

        .token-row {
            display: flex;
            gap: 8px;
        }

        .token-row input {
            flex: 1;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            outline: none;
        }

        .token-row button {
            padding: 10px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--red);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.05);
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a href="/" class="topbar-brand">Grab</a>
        <a href="/" class="topbar-back">&larr; Retour</a>
    </nav>

    <div class="page">
        <!-- Auth (not logged in) -->
        <div id="authSection">
            <h2>Connexion</h2>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Se connecter</div>
                <div class="auth-tab" data-tab="signup">Créer un compte</div>
            </div>

            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="toi@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn">Se connecter</button>
            </form>

            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="toi@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="8 caractères minimum" required>
                </div>
                <button type="submit" class="submit-btn">Créer mon compte</button>
            </form>

            <div class="divider">ou</div>

            <a href="#" class="oauth-btn">
                <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continuer avec Google
            </a>
            <a href="#" class="oauth-btn">
                <svg viewBox="0 0 24 24" fill="var(--text)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                Continuer avec GitHub
            </a>
        </div>

        <!-- Account (logged in) -->
        <div class="account-info" id="accountSection">
            <h2>Mon compte</h2>

            <div class="account-card">
                <div class="email">user@example.com</div>
                <div class="plan">Plan Free — <a href="/pro.html" style="color: var(--gold);">Passer Pro</a></div>
            </div>

            <div class="api-token">
                <label>Token API</label>
                <div class="token-row">
                    <input type="text" value="grab_sk_7f3a9b2c1d..." readonly>
                    <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)">Copier</button>
                </div>
            </div>

            <button class="logout-btn">Se déconnecter</button>
        </div>
    </div>

    <script>
        // Tabs
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
            });
        });
    </script>
</body>
</html>
