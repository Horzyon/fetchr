<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetchr Pro — 4K, FLAC, illimité</title>
    <meta name="description" content="Fetchr Pro : télécharge en 4K, audio FLAC, sans limite. 4€/mois, sans engagement.">
    <link rel="canonical" href="https://fetchr.fr/pro.html">
    <meta property="og:title" content="Fetchr Pro — 4K, FLAC, illimité">
    <meta property="og:description" content="Passe à Fetchr Pro : vidéos 4K, audio FLAC et MP3 320kbps, téléchargements illimités.">
    <meta property="og:url" content="https://fetchr.fr/pro.html">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #14141f;
            --surface-hover: #1c1c2a;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #6b6b80;
            --accent: #6366f1;
            --glow: #6366f1;
            --gold: #f59e0b;
            --radius: 12px;
        }

        [data-theme="light"] {
            --bg: #f4f4f8;
            --surface: #ffffff;
            --surface-hover: #eeeef2;
            --border: #d8d8e0;
            --text: #1a1a2e;
            --text-muted: #6b6b80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Top bar — same as index.html */
        .topbar {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            position: relative;
            z-index: 10;
        }

        .topbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-decoration: none;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .api-link {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: color 0.2s ease, border-color 0.2s ease;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.05em;
        }

        .api-link:hover {
            color: var(--text);
            border-color: var(--glow);
        }

        .pro-link {
            font-size: 0.8rem;
            font-weight: 600;
            color: #f59e0b;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #f59e0b;
            border-radius: 6px;
            font-family: 'Space Grotesk', sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .pro-link:hover {
            background: #f59e0b;
            color: #fff;
        }

        /* Theme toggle */
        .theme-toggle {
            position: relative;
            width: 44px;
            height: 24px;
            cursor: pointer;
        }

        .theme-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-thumb svg {
            width: 11px;
            height: 11px;
            fill: var(--bg);
        }

        .theme-toggle input:checked ~ .toggle-thumb {
            transform: translateX(20px);
            background: var(--glow);
        }

        /* Account button */
        .account-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
            text-decoration: none;
        }

        .account-btn:hover {
            border-color: var(--glow);
        }

        .account-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .account-btn.logged-in {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .account-btn.logged-in svg {
            display: none;
        }

        /* Page content */
        .page {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 80px 0;
            text-align: center;
        }

        /* Hero */
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3rem);
            letter-spacing: -0.03em;
            margin-bottom: 10px;
        }

        .hero h1 .brand {
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        /* What you get — simple list */
        .perks {
            text-align: left;
            margin-bottom: 36px;
        }

        .perk {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .perk:last-child { border-bottom: none; }

        .perk-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .perk-check svg {
            width: 11px;
            height: 11px;
            fill: #fff;
        }

        /* CTA */
        .cta {
            margin-top: 36px;
        }

        .price {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .price span {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .cta-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .cta-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.35);
        }

        .fine-print {
            margin-top: 12px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a href="/" class="topbar-brand">Fetchr</a>
        <div class="topbar-actions">
            <a href="/api.html" class="api-link">API</a>
            <a href="/pro.html" class="pro-link">Pro</a>
            <label class="theme-toggle" title="Changer de theme">
                <input type="checkbox" id="themeSwitch">
                <span class="toggle-track"></span>
                <span class="toggle-thumb">
                    <svg viewBox="0 0 16 16" id="themeIcon">
                        <path d="M8 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 8 1zm0 11a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 8 12zm7-4a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1 0-1h1a.5.5 0 0 1 .5.5zM4 8a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1 0-1h1A.5.5 0 0 1 4 8zm8.5-3.8a.5.5 0 0 1 0 .7l-.7.7a.5.5 0 1 1-.7-.7l.7-.7a.5.5 0 0 1 .7 0zM5 11.3a.5.5 0 0 1 0 .7l-.7.7a.5.5 0 0 1-.7-.7l.7-.7a.5.5 0 0 1 .7 0zm7.7.7a.5.5 0 0 1-.7 0l-.7-.7a.5.5 0 0 1 .7-.7l.7.7a.5.5 0 0 1 0 .7zM5 4.6a.5.5 0 0 1-.7.7l-.7-.7a.5.5 0 0 1 .7-.7l.7.7zM8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                    </svg>
                </span>
            </label>
            <a href="/account.html" class="account-btn" id="accountBtn" title="Mon compte">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
            </a>
        </div>
    </nav>

    <div class="page">
        <section class="hero">
            <h1><span class="brand">Fetchr</span> Pro</h1>
            <p>4K, FLAC, illimite, prioritaire.</p>
        </section>

        <div class="perks">
            <div class="perk">
                <div class="perk-check"><svg viewBox="0 0 12 12"><path d="M10 3L4.5 8.5 2 6"/></svg></div>
                Video jusqu'en 4K
            </div>
            <div class="perk">
                <div class="perk-check"><svg viewBox="0 0 12 12"><path d="M10 3L4.5 8.5 2 6"/></svg></div>
                Audio FLAC &amp; MP3 320kbps
            </div>
            <div class="perk">
                <div class="perk-check"><svg viewBox="0 0 12 12"><path d="M10 3L4.5 8.5 2 6"/></svg></div>
                Downloads illimites
            </div>
            <div class="perk">
                <div class="perk-check"><svg viewBox="0 0 12 12"><path d="M10 3L4.5 8.5 2 6"/></svg></div>
                Pre-fetch prioritaire
            </div>
            <div class="perk">
                <div class="perk-check"><svg viewBox="0 0 12 12"><path d="M10 3L4.5 8.5 2 6"/></svg></div>
                API — 1000 req/jour
            </div>
        </div>

        <div class="cta">
            <div class="price">4&#8364; <span>/mois</span></div>
            <a href="#" class="cta-btn">Passer Pro</a>
            <div class="fine-print">Sans engagement - Rembourse sous 7 jours</div>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api';

        // Theme toggle
        const themeSwitch = document.getElementById('themeSwitch');
        const saved = localStorage.getItem('theme');
        if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeSwitch.checked = true;
        }
        themeSwitch.addEventListener('change', () => {
            if (themeSwitch.checked) {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Auth check for topbar
        async function checkAuth() {
            const token = localStorage.getItem('fetchr_token');
            if (!token) return;

            try {
                const res = await fetch(`${API}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                });

                if (!res.ok) {
                    localStorage.removeItem('fetchr_token');
                    return;
                }

                const user = await res.json();
                const accountBtn = document.getElementById('accountBtn');
                accountBtn.classList.add('logged-in');
                accountBtn.textContent = user.username.charAt(0).toUpperCase();

                if (user.is_pro) {
                    const ctaBtn = document.querySelector('.cta-btn');
                    ctaBtn.textContent = 'Deja Pro';
                    ctaBtn.style.opacity = '0.6';
                    ctaBtn.style.cursor = 'default';
                    ctaBtn.style.pointerEvents = 'none';
                }
            } catch {
                localStorage.removeItem('fetchr_token');
            }
        }

        checkAuth();

        // Checkout Stripe
        document.querySelector('.cta-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('fetchr_token');
            if (!token) {
                window.location.href = '/account.html';
                return;
            }

            const btn = e.currentTarget;
            btn.textContent = 'Redirection...';
            btn.style.pointerEvents = 'none';

            try {
                const res = await fetch(`${API}/billing/checkout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (!res.ok) throw new Error('Erreur checkout');
                const data = await res.json();
                window.location.href = data.url;
            } catch {
                btn.textContent = 'Passer Pro';
                btn.style.pointerEvents = '';
            }
        });
    </script>
</body>
</html>
